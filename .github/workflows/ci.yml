# Rebuilds EduFlow from nothing on every push, on a machine that has never seen this project.
#
# The point is not to repeat what you already run locally. It is to prove the project builds
# somewhere that has no .env, no Homebrew Postgres and no Gradle cache — which is what a new
# laptop, a new contributor and a production server all look like.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: no point finishing a run for code
# that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # Tests run against real PostgreSQL, exactly as they do locally. That was a deliberate
    # choice in Step 0 and it has earned its keep: an in-memory database would have accepted
    # the @Lob/oid mismatch, the partial unique indexes and the CHECK constraints without
    # complaint, and those bugs would have reached production instead of a test report.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eduflow_test
          POSTGRES_USER: eduflow
          POSTGRES_PASSWORD: eduflow
        ports:
          - 5432:5432
        # Without this the job would start connecting before Postgres answers
        options: >-
          --health-cmd "pg_isready -U eduflow -d eduflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # Sonar needs the history to work out which lines are new in a pull request
          fetch-depth: 0

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only the default branch writes the shared cache; branches read it. Otherwise one
          # branch's dependencies keep evicting another's.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, check and test
        # Runs exactly what runs locally: compile, Checkstyle (maxWarnings=0), 272 tests,
        # JaCoCo and the 70% coverage gate.
        run: ./gradlew build --no-daemon
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/eduflow_test
          TEST_DB_USERNAME: eduflow
          TEST_DB_PASSWORD: eduflow

      - name: Publish the test report
        # Runs even when tests fail, which is exactly when the report is worth having
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
            build/reports/checkstyle
          retention-days: 7

  docker:
    name: Build the image
    runs-on: ubuntu-latest
    # No point building an image around code that does not pass its own tests
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        # Built but not pushed: this proves the Dockerfile works. Publishing it somewhere is a
        # separate decision, and one that needs a registry and credentials.
        run: docker build -t eduflow-backend:${{ github.sha }} .

  sonar:
    name: Sonar analysis
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    # Declared here so the step below can test whether a token exists: the secrets context is
    # not available in an `if`, but the env context is.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eduflow_test
          POSTGRES_USER: eduflow
          POSTGRES_PASSWORD: eduflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduflow -d eduflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Skip if Sonar is not configured yet
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "No SONAR_TOKEN secret set — skipping analysis. Add one to enable it."

      - name: Analyse
        # Only once a token exists. Without this guard the very first push to main would go red
        # for a tool that has not been set up yet, which teaches people to ignore red builds.
        if: ${{ env.SONAR_TOKEN != '' }}
        # Sonar reads the JaCoCo XML, so the tests have to run again in this job
        run: ./gradlew test sonar --no-daemon
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/eduflow_test
          TEST_DB_USERNAME: eduflow
          TEST_DB_PASSWORD: eduflow
