name: Diag offre prod
on:
  push:
    branches: [diag/offre-prod]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q numpy
      - run: |
          cat > f0.py <<'PY'
          import sys, wave, numpy as np
          w = wave.open(sys.argv[1]); x = np.frombuffer(w.readframes(w.getnframes()), np.int16).astype(float)
          f0 = []
          for i in range(0, len(x) - 1024, 800):
              s = x[i:i + 1024]
              if np.abs(s).mean() < 500: continue
              c = np.correlate(s, s, 'full')[1023:]; k = 40 + np.argmax(c[40:266]); f0.append(16000 / k)
          print(round(float(np.median(f0))) if f0 else 0)
          PY
          codes="7-r1 7-1-1 7-1-2 7-r2 7-2-1 7-2-2 7-r3 7-r4 7-3-1 7-3-2 7-r5 7-4-1 7-4-2"
          for c in 1 2 3 4; do codes="$codes 8-r$c 8-$c-1 8-$c-2 9-r$c 9-$c-1 9-$c-2"; done
          for c in $codes; do
            f=${c%%-*}eme
            curl -s -o v.mp4 "https://education-platform-front.vercel.app/videos/$f/$c.mp4?v=4"
            ffmpeg -loglevel error -y -ss 3 -t 30 -i v.mp4 -ac 1 -ar 16000 a.wav
            echo "RES $c $(stat -c %s v.mp4) $(python3 f0.py a.wav)"
          done
