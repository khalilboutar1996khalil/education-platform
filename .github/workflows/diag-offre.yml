name: Diag offre prod
on:
  push:
    branches: [diag/offre-prod]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for c in 7-1-1 7-r1; do curl -sI "https://education-platform-front.vercel.app/videos/7eme/$c.mp4?v=3" | grep -iE "^HTTP|content-length" | tr -d '\r' | tr '\n' ' '; echo " <- $c"; done
