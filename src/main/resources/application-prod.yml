
# Production. Every secret must come from environment variables.

spring:
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  datasource:
    hikari:
      # Release idle connections quickly to let Neon sleep.
      minimum-idle: 0
      idle-timeout: 30000
      maximum-pool-size: 5

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

app:
  jobs:
    deadline-cron: "0 0 * * * *"
