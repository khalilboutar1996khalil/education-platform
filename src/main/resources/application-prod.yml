# Production. Every secret must come from environment variables — there are no defaults here,
# so the app refuses to start if one is missing.

spring:
  mail:
    # Host, port, username and password come from SPRING_MAIL_* (see .env.production.example);
    # the SMTP sender stays off until SPRING_MAIL_HOST is set.
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false               # do not publish the API description publicly
  swagger-ui:
    enabled: false

logging:
  # One JSON object per line, MDC included, so a log aggregator can index requestId as a field
  # rather than a human having to read it. ECS is what Elastic and most hosted tools expect.
  structured:
    format:
      console: ecs
  level:
    root: INFO
