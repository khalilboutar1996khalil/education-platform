# Production. Every secret must come from environment variables — there are no defaults here,
# so the app refuses to start if one is missing.

spring:
  mail:
    # Host, port, username and password come from SPRING_MAIL_* (see .env.production.example);
    # the SMTP sender stays off until SPRING_MAIL_HOST is set.
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  datasource:
    hikari:
      # Neon bills compute for every hour the database is awake, and an open connection keeps it
      # awake. Release idle connections quickly so it can sleep between requests.
      minimum-idle: 0
      idle-timeout: 30s
      maximum-pool-size: 5

management:
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness answers without touching the database: that is the URL for
      # Render's health check and for an uptime pinger, which would otherwise keep Neon awake.
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false               # do not publish the API description publicly
  swagger-ui:
    enabled: false

logging:
  # One JSON object per line, MDC included, so a log aggregator can index requestId as a field
  # rather than a human having to read it. ECS is what Elastic and most hosted tools expect.
  structured:
    format:
      console: ecs
  level:
    root: INFO

app:
  jobs:
    # Hourly, on the hour, like the deadline reminder: one database wake-up an hour, not twelve
    deadline-cron: "0 0 * * * *"
