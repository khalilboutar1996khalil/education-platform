
# Automated tests (./gradlew test).
# Uses a separate database so tests never touch dev data.

spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/eduflow_test}
    username: ${TEST_DB_USERNAME:eduflow}
    password: ${TEST_DB_PASSWORD:eduflow}

  flyway:
    # Schema only: exclude curriculum content from tests.
    locations: classpath:db/migration

app:
  jobs:
    enabled: false

  storage:
    location: ${java.io.tmpdir}/eduflow-test-uploads

  security:
    login:
      max-failures: 1000
      lockout: 1m

  jwt:
    secret: ZWR1Zmxvdy1sb2NhbC1kZXYtb25seS1rZXktbm90LWEtc2VjcmV0LTAwMDAwMA==
    access-token-ttl: 15m
    refresh-token-ttl: 1d

management:
  endpoint:
    health:
      show-details: always
