# Local development on your machine (Homebrew PostgreSQL).


spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      idle-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000

management:
  endpoint:
    health:
      show-details: never
      # shows database status on /actuator/health

app:
  jwt:
    # Local development only — this key is public, in the repo, and must never reach production.
    secret: ${JWT_SECRET:ZWR1Zmxvdy1sb2NhbC1kZXYtb25seS1rZXktbm90LWEtc2VjcmV0LTAwMDAwMA==}

logging:
  level:
    com.example.education_platform: DEBUG
    # Uncomment to see every SQL query:
    # org.hibernate.SQL: DEBUG
