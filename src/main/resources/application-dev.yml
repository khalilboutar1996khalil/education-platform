# Local development on your machine (Homebrew PostgreSQL).

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eduflow}
    username: ${DB_USERNAME:eduflow}
    password: ${DB_PASSWORD:eduflow}

management:
  endpoint:
    health:
      show-details: always       # shows database status on /actuator/health

logging:
  level:
    com.example.education_platform: DEBUG
    # Uncomment to see every SQL query:
    # org.hibernate.SQL: DEBUG
