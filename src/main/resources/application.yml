# Shared settings for every profile. Profile files (application-<profile>.yml) override these.
# Active profile: "dev" by default; set SPRING_PROFILES_ACTIVE=prod in production.

spring:
  application:
    name: education-platform
  profiles:
    default: dev
  config:
    # Local secrets (DB password, JWT key…) live in a git-ignored .env file — see .env.example
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false          # no lazy loading from controllers — avoids hidden N+1 queries
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    locations: classpath:db/migration

  messages:
    fallback-to-system-locale: false   # always serve messages.properties (French), never the JVM's locale

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: EduFlow
    description: Education platform backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Base64 key, at least 256 bits. Generate one with: openssl rand -base64 32
    # No default on purpose — production must fail to start rather than sign with a known key.
    secret: ${JWT_SECRET}
    access-token-ttl: 15m     # short: an access token cannot be revoked
    refresh-token-ttl: 30d    # long: revocable through the refresh_tokens table
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
