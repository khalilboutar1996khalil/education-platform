
# Shared settings for every profile.
# Profile files override these settings.

spring:
  application:
    name: education-platform

  profiles:
    default: dev

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    locations: classpath:db/migration,classpath:db/content

  messages:
    fallback-to-system-locale: false

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] %logger{32} - %msg%n"

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: EduFlow
    description: Education platform backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  auth:
    # Students join through a book coupon or an access request the admin accepts; letting them sign
    # themselves up would skip that check (and the subscription). Only tests turn this on.
    self-registration-enabled: ${SELF_REGISTRATION_ENABLED:false}
  mail:
    from: ${APP_MAIL_FROM:no-reply@eduflow.dz}
    from-name: ${APP_MAIL_FROM_NAME:EduFlow}
    base-url: ${FRONTEND_URL:http://localhost:5173}

  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      full-name: ${ADMIN_FULL_NAME:Administrateur}

  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  security:
    login:
      max-failures: 5
      lockout: 15m

  storage:
    # local: the server's disk (fine locally and on a VPS). s3: an object store such as
    # Cloudflare R2, required on hosts that wipe their disk (Render's free plan).
    type: ${STORAGE_TYPE:local}
    location: ${STORAGE_LOCATION:./var/uploads}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
    max-file-size: 500MB
    allowed-content-types:
      - application/pdf
      - application/zip
      - application/x-zip-compressed
      - image/png
      - image/jpeg
      - text/plain
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
