plugins {
    id 'java'
    id 'jacoco'                 // test coverage reports
    id 'checkstyle'             // code style checks
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'EduFlow — education platform backend'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

ext {
    mapstructVersion = '1.6.3'
    lombokMapstructBindingVersion = '0.2.0'
    springdocVersion = '3.1.1'
}

dependencies {
    // Web, persistence, validation, security
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Database migrations
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Monitoring (health checks, info)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // API documentation (Swagger UI)
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Entity <-> DTO mapping. Lombok must run before MapStruct, hence the binding.
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
    options.compilerArgs += [
            '-Amapstruct.defaultComponentModel=spring',  // mappers become Spring beans
            '-Amapstruct.unmappedTargetPolicy=ERROR'     // forgetting a field fails the build
    ]
}

// ---------- Tests ----------

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    finalizedBy 'jacocoTestReport'
}

// ---------- Coverage (JaCoCo) ----------

// Classes with no logic worth testing are left out of the coverage numbers.
def coverageExclusions = [
        '**/EducationPlatformApplication*',
        '**/config/**',
        '**/dto/**',
        '**/entity/**',
        '**/*MapperImpl*'
]

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true   // read by SonarQube
        html.required = true  // for humans: build/reports/jacoco/test/html/index.html
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: coverageExclusions)
    }))
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
    }
    classDirectories.setFrom(jacocoTestReport.classDirectories)
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// ---------- Code style (Checkstyle) ----------

checkstyle {
    toolVersion = '14.1.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

// ---------- SonarQube ----------
// Run with: ./gradlew test sonar   (needs SONAR_TOKEN, and SONAR_HOST_URL unless it is localhost:9000)

sonar {
    properties {
        property 'sonar.projectKey', 'eduflow-backend'
        property 'sonar.projectName', 'EduFlow Backend'
        property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'http://localhost:9000'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path
        property 'sonar.coverage.exclusions', coverageExclusions.join(',')
    }
}
